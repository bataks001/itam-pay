<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ITAM PAY</title>

<link rel="manifest" href="manifest.json">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f5f9;
  color: #222;
}

.header {
  background: #1565C0;
  color: white;
  text-align: center;
  padding: 22px 15px 24px;
}

.header h1 {
  margin: 0;
  font-size: 28px;
  font-weight: bold;
}

.header p {
  margin: 5px 0 0;
  font-size: 14px;
}

.bismillah {
  margin-top: 10px;
  font-family: "Noto Naskh Arabic", "Amiri", "Traditional Arabic", serif;
  font-size: 20px;
  direction: rtl;
  line-height: 1.8;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 18px;
}

.cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 18px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.card-title {
  font-size: 13px;
  color: #777;
}

.card-value {
  margin-top: 6px;
  font-size: 22px;
  font-weight: bold;
  color: #1565C0;
}

.form-box,
.history-box {
  background: white;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

h2 {
  margin-top: 0;
  font-size: 18px;
}

label {
  display: block;
  margin-top: 12px;
  margin-bottom: 5px;
  font-size: 14px;
  font-weight: bold;
}

select,
input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 15px;
  background: white;
}

button {
  width: 100%;
  margin-top: 16px;
  padding: 13px;
  border: none;
  border-radius: 8px;
  background: #1565C0;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}

.history-item {
  border-bottom: 1px solid #eee;
  padding: 12px 0;
}

.history-item:last-child {
  border-bottom: none;
}

.history-main {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.history-name {
  font-weight: bold;
}

.history-amount {
  font-weight: bold;
  color: #1565C0;
}

.history-detail {
  margin-top: 4px;
  font-size: 13px;
  color: #777;
}

.delete-btn {
  width: auto;
  margin-top: 8px;
  padding: 6px 10px;
  background: #d32f2f;
  font-size: 12px;
}

.empty {
  text-align: center;
  color: #888;
  padding: 10px;
}

.loading {
  text-align: center;
  color: #888;
  padding: 10px;
}
</style>
</head>

<body>

<div class="header">
  <h1>ITAM PAY</h1>
  <p>PPOB • Transfer • Pembayaran Digital</p>

  <div class="bismillah">
    بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ
  </div>
</div>

<div class="container">

  <div class="cards">
    <div class="card">
      <div class="card-title">📋 Transaksi Hari Ini</div>
      <div class="card-value" id="jumlahTransaksi">0</div>
    </div>

    <div class="card">
      <div class="card-title">💰 Pendapatan Admin</div>
      <div class="card-value" id="totalAdmin">Rp 0</div>
    </div>
  </div>

  <div class="form-box">
    <h2>Transaksi Baru</h2>

    <label for="jenis">Jenis Transaksi</label>
    <select id="jenis">
      <option value="">Memuat...</option>
    </select>

    <label for="via">Via</label>
    <select id="via">
      <option value="">Memuat...</option>
    </select>

    <label for="nominal">Nominal</label>
    <input
      type="text"
      id="nominal"
      inputmode="numeric"
      placeholder="Masukkan nominal"
    >

    <button onclick="simpan()">Simpan Transaksi</button>
  </div>

  <div class="history-box">
    <h2>Riwayat</h2>
    <div id="riwayat" class="loading">Memuat riwayat...</div>
  </div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwIxrFwhGsGV2OAaX0Vesxz9mAUwBFHQsKUo758x6vDSsSdCT-ySDHVx2HQDgiimI0AYA/exec";


document.addEventListener("DOMContentLoaded", function() {

  loadMaster();
  loadDashboard();
  loadRiwayat();

  const nominal = document.getElementById("nominal");

  nominal.addEventListener("input", function() {

    let angka = this.value.replace(/\D/g, "");

    if (angka) {
      this.value = Number(angka).toLocaleString("id-ID");
    } else {
      this.value = "";
    }

  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./service-worker.js");
  }

});


function jsonp(url, callback) {

  const callbackName =
    "callback_" + Date.now() + Math.floor(Math.random() * 1000);

  window[callbackName] = function(data) {

    delete window[callbackName];

    script.remove();

    callback(data);

  };

  const script = document.createElement("script");

  script.src =
    url +
    (url.includes("?") ? "&" : "?") +
    "callback=" +
    callbackName;

  document.body.appendChild(script);
}


function loadMaster() {

  jsonp(API_URL + "?action=master", function(data) {

    const jenis = document.getElementById("jenis");
    const via = document.getElementById("via");

    jenis.innerHTML = '<option value="">Pilih transaksi</option>';
    via.innerHTML = '<option value="">Pilih via</option>';

    if (data && data.transaksi) {

      data.transaksi.forEach(function(item) {

        const option = document.createElement("option");

        option.value = item;
        option.textContent = item;

        jenis.appendChild(option);

      });

    }

    if (data && data.via) {

      data.via.forEach(function(item) {

        const option = document.createElement("option");

        option.value = item;
        option.textContent = item;

        via.appendChild(option);

      });

    }

  });

}


function loadDashboard() {

  jsonp(API_URL + "?action=dashboard", function(data) {

    if (!data) return;

    document.getElementById("jumlahTransaksi").textContent =
      data.jumlahTransaksi || 0;

    document.getElementById("totalAdmin").textContent =
      "Rp " + Number(data.totalAdmin || 0).toLocaleString("id-ID");

  });

}


function formatRupiah(angka) {

  return "Rp " +
    Number(angka || 0).toLocaleString("id-ID");

}


function simpan() {

  const jenis =
    document.getElementById("jenis").value;

  const via =
    document.getElementById("via").value;

  const nominalText =
    document.getElementById("nominal").value;

  const nominal =
    Number(nominalText.replace(/\D/g, ""));

  if (!jenis) {
    alert("Pilih jenis transaksi.");
    return;
  }

  if (!via) {
    alert("Pilih via.");
    return;
  }

  if (!nominal || nominal <= 0) {
    alert("Masukkan nominal.");
    return;
  }

  const button =
    document.querySelector(".form-box button");

  button.disabled = true;
  button.textContent = "Menyimpan...";

  const params =
    "?action=simpan" +
    "&jenis=" + encodeURIComponent(jenis) +
    "&via=" + encodeURIComponent(via) +
    "&nominal=" + encodeURIComponent(nominal);

  jsonp(API_URL + params, function(data) {

    button.disabled = false;
    button.textContent = "Simpan Transaksi";

    if (data && data.success) {

      alert("Transaksi berhasil disimpan.");

      resetForm();

      loadDashboard();
      loadRiwayat();

    } else {

      alert(
        data && data.message
          ? data.message
          : "Transaksi gagal disimpan."
      );

    }

  });

}


function resetForm() {

  document.getElementById("jenis").value = "";
  document.getElementById("via").value = "";
  document.getElementById("nominal").value = "";

}


function loadRiwayat() {

  const container =
    document.getElementById("riwayat");

  container.innerHTML =
    '<div class="loading">Memuat riwayat...</div>';

  jsonp(API_URL + "?action=riwayat", function(data) {

    if (!data || !data.length) {

      container.innerHTML =
        '<div class="empty">Belum ada riwayat transaksi.</div>';

      return;
    }

    container.innerHTML = "";

    data.forEach(function(item) {

      const div =
        document.createElement("div");

      div.className = "history-item";

      div.innerHTML = `
        <div class="history-main">
          <div class="history-name">
            ${item.transaksi || ""}
          </div>

          <div class="history-amount">
            ${formatRupiah(item.nominal)}
          </div>
        </div>

        <div class="history-detail">
          ${item.tanggal || ""} • ${item.via || ""}
        </div>

        <button
          class="delete-btn"
          onclick="hapusRiwayat(${item.row})">
          Hapus
        </button>
      `;

      container.appendChild(div);

    });

  });

}


function hapusRiwayat(row) {

  if (!confirm("Hapus transaksi ini?")) {
    return;
  }

  jsonp(
    API_URL +
    "?action=hapus&row=" +
    encodeURIComponent(row),

    function(data) {

      if (data && data.success) {

        alert("Transaksi berhasil dihapus.");

        loadDashboard();
        loadRiwayat();

      } else {

        alert(
          data && data.message
            ? data.message
            : "Transaksi gagal dihapus."
        );

      }

    }
  );

}

</script>

</body>
</html>
```
