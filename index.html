<!DOCTYPE html>

<html lang="id">

<head>

  <meta charset="UTF-8">

<meta name="viewport"
     content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
     content="#1565C0">

<meta name="description"
     content="ITAM PAY - PPOB • Transfer • Pembayaran Digital">

  <link rel="manifest" href="manifest.json">

  <title>ITAM PAY</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #f3f5f9;
      padding: 10px;
    }

    .container {
      width: 100%;
      max-width: 100%;
      margin: auto;
    }

    /* HEADER */

    .header {
      background: #1565C0;
      color: #fff;
      border-radius: 22px;
      padding: 38px 25px;
      text-align: center;
      box-shadow: 0 6px 18px rgba(0,0,0,.15);
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 52px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .header p {
      margin-top: 8px;
      font-size: 21px;
    }

    /* DASHBOARD */

    .dashboard {
      display: flex;
      gap: 14px;
      margin-bottom: 20px;
    }

    .card {
      flex: 1;
      background: #fff;
      border-radius: 18px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(0,0,0,.12);
    }

    .icon {
      font-size: 50px;
      margin-bottom: 10px;
    }

    .angka {
      font-size: 40px;
      font-weight: bold;
      color: #1565C0;
      margin-bottom: 8px;
    }

    .judul {
      font-size: 20px;
      color: #666;
    }

    /* FORM */

    .formBox {
      background: #fff;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 4px 12px rgba(0,0,0,.12);
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 10px;
      font-size: 22px;
      font-weight: bold;
    }

    select,
    input {
      width: 100%;
      height: 72px;
      border: 1px solid #d8d8d8;
      border-radius: 16px;
      padding: 0 18px;
      font-size: 25px;
      outline: none;
      background: #fff;
    }

    select:focus,
    input:focus {
      border: 2px solid #1565C0;
    }

    /* BUTTON */

    button {
      width: 100%;
      height: 72px;
      border: none;
      border-radius: 18px;
      font-size: 28px;
      font-weight: bold;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .btnSave {
      margin-top: 30px;
      background: #2E7D32;
    }

    .btnSave:hover {
      background: #1B5E20;
    }

    /* RIWAYAT */

    .history {
      margin-top: 22px;
      background: #fff;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 4px 12px rgba(0,0,0,.12);
    }

    .history h3 {
      font-size: 26px;
      color: #1565C0;
      margin-bottom: 18px;
    }

    .historyList {
      max-height: 420px;
      overflow-y: auto;
    }

    .itemRiwayat {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
      font-size: 20px;
    }

    .itemRiwayat > div:first-child {
      flex: 1;
    }

    .itemRiwayat > div:nth-child(2) {
      min-width: 130px;
    }

    .btnDelete {
      width: 38px !important;
      height: 38px !important;
      min-width: 38px;
      padding: 0;
      margin: 0;
      border: none;
      border-radius: 10px;
      background: #D32F2F;
      color: #fff;
      font-size: 18px;
      line-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .btnDelete:hover {
      background: #B71C1C;
    }

    /* MOBILE */

    @media (max-width: 480px) {

      body {
        padding: 8px;
      }

      .header {
        padding: 34px 18px;
      }

      .header h1 {
        font-size: 46px;
      }

      .header p {
        font-size: 19px;
      }

      .card {
        padding: 22px;
      }

      .icon {
        font-size: 44px;
      }

      .angka {
        font-size: 34px;
      }

      .judul {
        font-size: 18px;
      }

      label {
        font-size: 20px;
      }

      select,
      input {
        height: 68px;
        font-size: 23px;
      }

      button {
        height: 68px;
        font-size: 26px;
      }

      .history h3 {
        font-size: 24px;
      }

      .itemRiwayat {
        font-size: 18px;
      }

      .itemRiwayat > div:nth-child(2) {
        min-width: 110px;
      }

    }

  </style>

</head>

<body>

  <div class="container">


<div class="header">

  <h1>ITAM PAY</h1>

  <p>PPOB • Transfer • Pembayaran Digital</p>

</div>


<div class="dashboard">

  <div class="card">

    <div class="icon">📋</div>

    <div id="jumlahTransaksi" class="angka">0</div>

    <div class="judul">Transaksi Hari Ini</div>

  </div>

  <div class="card">

    <div class="icon">💰</div>

    <div id="totalAdmin" class="angka">Rp 0</div>

    <div class="judul">Pendapatan Admin</div>

  </div>

</div>


<div class="formBox">

  <label>Jenis Transaksi</label>

  <select id="jenis">

    <option value="">Memuat...</option>

  </select>


  <label>Via</label>

  <select id="via">

    <option value="">Memuat...</option>

  </select>


  <label>Nominal</label>

  <input
    type="text"
    id="nominal"
    inputmode="numeric"
    autocomplete="off"
    placeholder="Masukkan Nominal">


  <button
    class="btnSave"
    onclick="simpan()">

    SIMPAN

  </button>

</div>


<div class="history">

  <h3>10 Transaksi Terakhir</h3>

  <div id="historyList" class="historyList">

    Memuat data...

  </div>

</div>


  </div>

  <script>

    var API_URL =
      "https://script.google.com/macros/s/AKfycbwIxrFwhGsGV2OAaX0Vesxz9mAUwBFHQsKUo758x6vDSsSdCT-ySDHVx2HQDgiimI0AYA/exec";


    function jsonp(action, data, selesai) {

      var namaCallback =
        "itamPay_" +
        Date.now() +
        "_" +
        Math.floor(Math.random() * 10000);


      var script =
        document.createElement("script");


      var url =
        API_URL +
        "?action=" +
        encodeURIComponent(action) +
        "&callback=" +
        encodeURIComponent(namaCallback);


      if (data) {

        for (var key in data) {

          url +=
            "&" +
            encodeURIComponent(key) +
            "=" +
            encodeURIComponent(data[key]);

        }

      }


      window[namaCallback] =
        function(hasil) {

          selesai(null, hasil);

          delete window[namaCallback];

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }

        };


      script.onerror =
        function() {

          selesai(
            new Error("Gagal menghubungi Apps Script."),
            null
          );

          delete window[namaCallback];

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }

        };


      script.src = url;

      document.head.appendChild(script);

    }


    document.addEventListener(
      "DOMContentLoaded",
      function() {

        loadMaster();

        loadDashboard();

        loadRiwayat();


        var nominal =
          document.getElementById("nominal");


        nominal.addEventListener(
          "input",
          function() {

            var angka =
              this.value.replace(/\D/g, "");


            if (angka === "") {

              this.value = "";

              return;

            }


            this.value =
              Number(angka).toLocaleString("id-ID");

          }
        );


        if ("serviceWorker" in navigator) {

          navigator.serviceWorker
            .register("./service-worker.js")
            .then(
              function() {

                console.log(
                  "Service Worker aktif"
                );

              }
            )
            .catch(
              function(error) {

                console.error(
                  "Service Worker gagal:",
                  error
                );

              }
            );

        }

      }
    );


    function loadMaster() {

      jsonp(
        "master",
        null,
        function(error, data) {

          if (error) {

            console.error("Master:", error);

            document.getElementById("jenis").innerHTML =
              '<option value="">Gagal memuat</option>';

            document.getElementById("via").innerHTML =
              '<option value="">Gagal memuat</option>';

            return;

          }


          var jenis =
            document.getElementById("jenis");


          var via =
            document.getElementById("via");


          jenis.innerHTML =
            '<option value="">Pilih Transaksi</option>';


          via.innerHTML =
            '<option value="">Pilih Via</option>';


          if (
            data &&
            Array.isArray(data.transaksi)
          ) {

            data.transaksi.forEach(
              function(item) {

                var option =
                  document.createElement("option");

                option.value = item;

                option.textContent = item;

                jenis.appendChild(option);

              }
            );

          }


          if (
            data &&
            Array.isArray(data.via)
          ) {

            data.via.forEach(
              function(item) {

                var option =
                  document.createElement("option");

                option.value = item;

                option.textContent = item;

                via.appendChild(option);

              }
            );

          }

        }
      );

    }


    function loadDashboard() {

      jsonp(
        "dashboard",
        null,
        function(error, data) {

          if (error) {

            console.error("Dashboard:", error);

            return;

          }


          document.getElementById(
            "jumlahTransaksi"
          ).textContent =
            data.transaksi || 0;


          document.getElementById(
            "totalAdmin"
          ).textContent =
            formatRupiah(data.admin || 0);

        }
      );

    }


    function formatRupiah(angka) {

      return "Rp " +
        Number(angka || 0).toLocaleString("id-ID");

    }


    function simpan() {

      var jenis =
        document.getElementById("jenis").value;


      var via =
        document.getElementById("via").value;


      var nominal =
        document.getElementById("nominal")
          .value
          .replace(/\D/g, "");


      if (
        jenis === "" ||
        via === "" ||
        nominal === ""
      ) {

        alert("Lengkapi semua data.");

        return;

      }


      var tombol =
        document.querySelector(".btnSave");


      tombol.disabled = true;

      tombol.textContent =
        "MENYIMPAN...";


      jsonp(
        "simpan",
        {
          jenis: jenis,
          via: via,
          nominal: nominal
        },
        function(error, hasil) {

          if (error) {

            alert(
              "Error: " +
              error.message
            );

            tombol.disabled = false;

            tombol.textContent =
              "SIMPAN";

            return;

          }


          if (
            !hasil ||
            !hasil.success
          ) {

            alert(
              "Gagal menyimpan transaksi."
            );

            tombol.disabled = false;

            tombol.textContent =
              "SIMPAN";

            return;

          }


          alert(
            "Transaksi berhasil disimpan."
          );


          resetForm();

          loadDashboard();

          loadRiwayat();


          tombol.disabled = false;

          tombol.textContent =
            "SIMPAN";

        }
      );

    }


    function resetForm() {

      document.getElementById(
        "jenis"
      ).selectedIndex = 0;


      document.getElementById(
        "via"
      ).selectedIndex = 0;


      document.getElementById(
        "nominal"
      ).value = "";

    }


    function loadRiwayat() {

      jsonp(
        "riwayat",
        null,
        function(error, data) {

          var history =
            document.getElementById(
              "historyList"
            );


          if (error) {

            history.innerHTML =
              "Gagal memuat riwayat.";

            console.error(
              "Riwayat:",
              error
            );

            return;

          }


          if (
            !data ||
            data.length === 0
          ) {

            history.innerHTML =
              "<div style='text-align:center;padding:20px'>" +
              "Belum ada transaksi" +
              "</div>";

            return;

          }


          var html = "";


          data.forEach(
            function(r) {

              html +=
                '<div class="itemRiwayat">' +

                  '<div>' +

                    '<b>' +
                    r.transaksi +
                    '</b><br>' +

                    '<small>' +
                    r.via +
                    '</small>' +

                  '</div>' +

                  '<div style="text-align:right">' +

                    '<b>' +
                    r.nominal +
                    '</b><br>' +

                    '<small>' +
                    r.tanggal +
                    '</small>' +

                  '</div>' +

                  '<button ' +
                    'class="btnDelete" ' +
                    'onclick="hapusRiwayat(' +
                    r.row +
                    ')" ' +
                    'title="Hapus transaksi">' +

                    '🗑' +

                  '</button>' +

                '</div>';

            }
          );


          history.innerHTML =
            html;

        }
      );

    }


    function hapusRiwayat(row) {

      var yakin =
        confirm(
          "Hapus transaksi ini?\n\n" +
          "Data yang dihapus tidak dapat dikembalikan."
        );


      if (!yakin) {
        return;
      }


      jsonp(
        "hapus",
        {
          row: row
        },
        function(error, hasil) {

          if (error) {

            alert(
              "Gagal menghapus transaksi: " +
              error.message
            );

            return;

          }


          if (
            !hasil ||
            !hasil.success
          ) {

            alert(
              "Gagal menghapus transaksi."
            );

            return;

          }


          loadDashboard();

          loadRiwayat();

        }
      );

    }

  </script>

</body>

</html>
