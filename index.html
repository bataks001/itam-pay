<!DOCTYPE html>

<html lang="id">

<head>

  <meta charset="UTF-8">

<meta name="viewport"
     content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
     content="#1565C0">

<meta name="description"
     content="ITAM PAY - PPOB • Transfer • Pembayaran Digital">

  <link rel="manifest" href="manifest.json">

  <title>ITAM PAY</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #dfe6f3;
      padding: 10px;
    }

    .container {
      width: 100%;
      max-width: 100%;
      margin: auto;
    }

    /* HEADER */

    .header {
      background: linear-gradient(135deg, #0D47C9 17%, #1565C0 62%, #1976D2 100%);
      color: #fff;
      border-radius: 22px;
      padding: 38px 25px;
      text-align: center;
      box-shadow: 0 6px 18px rgba(0,0,0,.15);
      margin-bottom: 20px;
    }

    .header h1 {
      font-weight: bold;
      letter-spacing: .5px;
    }

    .header p {
      margin-top: 3px;
      font-size: 13px;
      white-space: nowrap;
    }

    .headerContent {
      display: flex;
      align-items: center;
      text-align: left;
      gap: 14px;
    }

    .headerLogo {
      width: 84px;
      height: 84px;
      flex: 0 0 84px;
      object-fit: cover;
      border-radius: 16px;
    }

    .headerText {
      min-width: 0;
      flex: 1;
    }

    .header h1 {
      font-size: 50px;
      line-height: 1;
      letter-spacing: .5px;
    }

    .settingsButton {
      width: 40px;
      height: 40px;
      min-width: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.28);
      font-size: 24px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateY(-32px);
    }

    .settingsButton:hover {
      background: rgba(255,255,255,.28);
    }

    .settingsPanel {
      display: none;
      margin-top: -8px;
      margin-bottom: 20px;
      background: #fff;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 4px 12px rgba(0,0,0,.12);
    }

    .settingsPanel.active {
      display: block;
    }

    .settingsTitle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .settingsTitle h3 {
      color: #1565C0;
      font-size: 22px;
    }

    .settingsClose {
      width: 38px;
      height: 38px;
      min-width: 38px;
      border-radius: 10px;
      background: #f1f3f6;
      color: #555;
      font-size: 22px;
      padding: 0;
    }

    .settingRow {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 14px;
      margin-top: 10px;
      background: #fafbfc;
    }

    .settingRowTitle {
      font-size: 17px;
      font-weight: bold;
      color: #333;
      margin-bottom: 6px;
    }

    .settingRowText {
      font-size: 14px;
      color: #777;
      line-height: 1.4;
    }

    .settingList {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .settingChip {
      display: inline-block;
      padding: 6px 9px;
      border-radius: 9px;
      background: #eaf2ff;
      color: #1565C0;
      font-size: 13px;
    }

    /* DASHBOARD */

    .dashboard {
      display: flex;
      gap: 14px;
      margin-bottom: 20px;
    }

    .card {
      flex: 1;
      background: linear-gradient(135deg, #0D47C9 17%, #1565C0 62%, #1976D2 100%);
      border-radius: 18px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(0,0,0,.12);
    }

    .icon {
      font-size: 30px;
      margin-bottom: 3px;
    }

    .angka {
      font-size: 45px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .judul {
      font-size: 19px;
      color: #ffffff;
    }

    /* FORM */

    .formBox {
      background: #fff;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 4px 12px rgba(0,0,0,.12);
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 10px;
      font-size: 22px;
      font-weight: bold;
    }

    select,
    input {
      width: 100%;
      height: 72px;
      border: 1px solid #d8d8d8;
      border-radius: 16px;
      padding: 0 18px;
      font-size: 25px;
      outline: none;
      background: #fff;
    }

    select:focus,
    input:focus {
      border: 2px solid #1565C0;
    }

    /* BUTTON */

    button {
      width: 100%;
      height: 72px;
      border: none;
      border-radius: 18px;
      font-size: 28px;
      font-weight: bold;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .btnSave {
      margin-top: 30px;
      background: #073763;
    }

    .btnSave:hover {
      background: #073763;
    }

    /* RIWAYAT */

    .history {
      margin-top: 22px;
      background: #fff;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 4px 12px rgba(0,0,0,.12);
    }

    .history h3 {
      font-size: 26px;
      color: #000000;
      margin-bottom: 18px;
    }

    .historyList {
      max-height: 420px;
      overflow-y: auto;
    }

    .itemRiwayat {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
      font-size: 20px;
    }

    .itemRiwayat > div:first-child {
      flex: 1;
    }

    .itemRiwayat > div:nth-child(2) {
      min-width: 130px;
    }

    .btnDelete {
      width: 38px !important;
      height: 38px !important;
      min-width: 38px;
      padding: 0;
      margin: 0;
      border: none;
      border-radius: 10px;
      background: #073763;
      color: #fff;
      font-size: 18px;
      line-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .btnDelete:hover {
      background: #073763;
    }

    /* MOBILE */

    @media (max-width: 480px) {

      body {
        padding: 8px;
      }

      .header {
        padding: 34px 18px;
      }

      .header h1 {
        font-size: 46px;
      }

      .header p {
        font-size: 12px;
      }

      .header {
        padding: 20px 16px;
      }

      .headerLogo {
        width: 70px;
        height: 70px;
        flex-basis: 70px;
        border-radius: 14px;
      }

      .header h1 {
        font-size: 46px;
      }

      .settingsButton {
        width: 44px;
        height: 44px;
        min-width: 44px;
        font-size: 22px;
      }

      .card {
        padding: 22px;
      }

      .icon {
        font-size: 44px;
      }

      .angka {
        font-size: 34px;
      }

      .judul {
        font-size: 18px;
      }

      label {
        font-size: 20px;
      }

      select,
      input {
        height: 68px;
        font-size: 23px;
      }

      button {
        height: 68px;
        font-size: 26px;
      }

      .history h3 {
        font-size: 24px;
      }

      .itemRiwayat {
        font-size: 18px;
      }

      .itemRiwayat > div:nth-child(2) {
        min-width: 110px;
      }

    }

  </style>

</head>

<body>

  <div class="container">


<div class="header">

  <div class="headerContent">

    <img
      class="headerLogo"
      src="ITAM_PAY_icon.png"
      alt="ITAM PAY">

    <div class="headerText">

      <h1>ITAM PAY</h1>

      <p>PPOB • Transfer • Pembayaran Digital</p>

    </div>

    <button
      class="settingsButton"
      type="button"
      onclick="togglePengaturan()"
      title="Pengaturan">

      ⚙

    </button>

  </div>

</div>


<div id="settingsPanel" class="settingsPanel">

  <div class="settingsTitle">

    <h3>Pengaturan</h3>

    <button
      class="settingsClose"
      type="button"
      onclick="togglePengaturan()"
      title="Tutup">

      ×

    </button>

  </div>

  <div class="settingRow">

    <div class="settingRowTitle">
      Jenis Transaksi
    </div>

    <div
      id="settingTransaksi"
      class="settingList">

      Memuat...

    </div>

  </div>

  <div class="settingRow">

    <div class="settingRowTitle">
      Via Pembayaran
    </div>

    <div
      id="settingVia"
      class="settingList">

      Memuat...

    </div>

  </div>

  <div class="settingRow">

    <div class="settingRowTitle">
      Data Pengaturan
    </div>

    <div class="settingRowText">
      Daftar transaksi dan Via mengikuti data aktif pada sheet SETTING.
    </div>

  </div>

</div>
 
<div class="dashboard">

  <div class="card">

    <div class="icon">🛎️</div>

    <div id="jumlahTransaksi" class="angka">0</div>

    <div class="judul">Transaksi Hari Ini</div>

  </div>
   
 <div class="card">

    <div class="icon">🪙</div>

    <div id="totalAdmin" class="angka">Rp 0</div>

    <div class="judul">Pendapatan Admin</div>

  </div>

</div>


<div class="formBox">

  <label>Jenis Transaksi</label>

  <select id="jenis">

    <option value="">Memuat...</option>

  </select>


  <label>Via</label>

  <select id="via">

    <option value="">Memuat...</option>

  </select>


  <label>Nominal</label>

  <input
    type="text"
    id="nominal"
    inputmode="numeric"
    autocomplete="off"
    placeholder="Masukkan Nominal">


  <button
    class="btnSave"
    onclick="simpan()">

    SIMPAN

  </button>

</div>


<div class="history">

  <h3>Transaksi Hari Ini</h3>

  <div id="historyList" class="historyList">

    Memuat data...

  </div>

</div>


  </div>

  <script>

    var API_URL =
      "https://script.google.com/macros/s/AKfycbwIxrFwhGsGV2OAaX0Vesxz9mAUwBFHQsKUo758x6vDSsSdCT-ySDHVx2HQDgiimI0AYA/exec";


    function jsonp(action, data, selesai) {

      var namaCallback =
        "itamPay_" +
        Date.now() +
        "_" +
        Math.floor(Math.random() * 10000);


      var script =
        document.createElement("script");


      var url =
        API_URL +
        "?action=" +
        encodeURIComponent(action) +
        "&callback=" +
        encodeURIComponent(namaCallback);


      if (data) {

        for (var key in data) {

          url +=
            "&" +
            encodeURIComponent(key) +
            "=" +
            encodeURIComponent(data[key]);

        }

      }


      window[namaCallback] =
        function(hasil) {

          selesai(null, hasil);

          delete window[namaCallback];

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }

        };


      script.onerror =
        function() {

          selesai(
            new Error("Gagal menghubungi Apps Script."),
            null
          );

          delete window[namaCallback];

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }

        };


      script.src = url;

      document.head.appendChild(script);

    }


    document.addEventListener(
      "DOMContentLoaded",
      function() {

        loadMaster();

        loadDashboard();

        loadRiwayat();


        var nominal =
          document.getElementById("nominal");


        nominal.addEventListener(
          "input",
          function() {

            var angka =
              this.value.replace(/\D/g, "");


            if (angka === "") {

              this.value = "";

              return;

            }


            this.value =
              Number(angka).toLocaleString("id-ID");

          }
        );


        if ("serviceWorker" in navigator) {

          navigator.serviceWorker
            .register("./service-worker.js")
            .then(
              function() {

                console.log(
                  "Service Worker aktif"
                );

              }
            )
            .catch(
              function(error) {

                console.error(
                  "Service Worker gagal:",
                  error
                );

              }
            );

        }

      }
    );


    function togglePengaturan() {

      var panel =
        document.getElementById("settingsPanel");

      if (!panel) {
        return;
      }

      panel.classList.toggle("active");

    }


    function tampilkanPengaturan(data) {

      var transaksi =
        document.getElementById("settingTransaksi");

      var via =
        document.getElementById("settingVia");

      if (transaksi) {

        transaksi.innerHTML = "";

        if (
          data &&
          Array.isArray(data.transaksi) &&
          data.transaksi.length > 0
        ) {

          data.transaksi.forEach(
            function(item) {

              var chip =
                document.createElement("span");

              chip.className =
                "settingChip";

              chip.textContent =
                item;

              transaksi.appendChild(chip);

            }
          );

        }
        else {

          transaksi.textContent =
            "Belum ada data.";

        }

      }

      if (via) {

        via.innerHTML = "";

        if (
          data &&
          Array.isArray(data.via) &&
          data.via.length > 0
        ) {

          data.via.forEach(
            function(item) {

              var chip =
                document.createElement("span");

              chip.className =
                "settingChip";

              chip.textContent =
                item;

              via.appendChild(chip);

            }
          );

        }
        else {

          via.textContent =
            "Belum ada data.";

        }

      }

    }


    function loadMaster() {

      jsonp(
        "master",
        null,
        function(error, data) {

          if (error) {

            console.error("Master:", error);

            document.getElementById("jenis").innerHTML =
              '<option value="">Gagal memuat</option>';

            document.getElementById("via").innerHTML =
              '<option value="">Gagal memuat</option>';

            return;

          }


          var jenis =
            document.getElementById("jenis");


          var via =
            document.getElementById("via");


          jenis.innerHTML =
            '<option value="">Pilih Transaksi</option>';


          via.innerHTML =
            '<option value="">Pilih Via</option>';


          if (
            data &&
            Array.isArray(data.transaksi)
          ) {

            data.transaksi.forEach(
              function(item) {

                var option =
                  document.createElement("option");

                option.value = item;

                option.textContent = item;

                jenis.appendChild(option);

              }
            );

          }


          if (
            data &&
            Array.isArray(data.via)
          ) {

            data.via.forEach(
              function(item) {

                var option =
                  document.createElement("option");

                option.value = item;

                option.textContent = item;

                via.appendChild(option);

              }
            );

          }

          tampilkanPengaturan(data);

        }
      );

    }


    function loadDashboard() {

      jsonp(
        "dashboard",
        null,
        function(error, data) {

          if (error) {

            console.error("Dashboard:", error);

            return;

          }


          document.getElementById(
            "jumlahTransaksi"
          ).textContent =
            data.transaksi || 0;


          document.getElementById(
            "totalAdmin"
          ).textContent =
            formatRupiah(data.admin || 0);

        }
      );

    }


    function formatRupiah(angka) {

      return "Rp " +
        Number(angka || 0).toLocaleString("id-ID");

    }


    function simpan() {

      var jenis =
        document.getElementById("jenis").value;


      var via =
        document.getElementById("via").value;


      var nominal =
        document.getElementById("nominal")
          .value
          .replace(/\D/g, "");


      if (
        jenis === "" ||
        via === "" ||
        nominal === ""
      ) {

        alert("Lengkapi semua data.");

        return;

      }


      var tombol =
        document.querySelector(".btnSave");


      tombol.disabled = true;

      tombol.textContent =
        "MENYIMPAN...";


      jsonp(
        "simpan",
        {
          jenis: jenis,
          via: via,
          nominal: nominal
        },
        function(error, hasil) {

          if (error) {

            alert(
              "Error: " +
              error.message
            );

            tombol.disabled = false;

            tombol.textContent =
              "SIMPAN";

            return;

          }


          if (
            !hasil ||
            !hasil.success
          ) {

            tampilkanPesan("Gagal menyimpan transaksi.");

            tombol.disabled = false;

            tombol.textContent =
              "SIMPAN";

            return;

          }


          tampilkanPesan("Transaksi berhasil disimpan.");


          resetForm();

          loadDashboard();

          loadRiwayat();


          tombol.disabled = false;

          tombol.textContent =
            "SIMPAN";

        }
      );

    }


    function resetForm() {

      document.getElementById(
        "jenis"
      ).selectedIndex = 0;


      document.getElementById(
        "via"
      ).selectedIndex = 0;


      document.getElementById(
        "nominal"
      ).value = "";

    }


    function loadRiwayat() {

      jsonp(
        "riwayat",
        null,
        function(error, data) {

          var history =
            document.getElementById(
              "historyList"
            );


          if (error) {

            history.innerHTML =
              "Gagal memuat riwayat.";

            console.error(
              "Riwayat:",
              error
            );

            return;

          }


          if (
            !data ||
            data.length === 0
          ) {

            history.innerHTML =
              "<div style='text-align:center;padding:20px'>" +
              "Belum ada transaksi" +
              "</div>";

            return;

          }


          var html = "";


          data.forEach(
            function(r) {

              html +=
                '<div class="itemRiwayat">' +

                  '<div>' +

                    '<b>' +
                    r.transaksi +
                    '</b><br>' +

                    '<small>' +
                    r.via +
                    '</small>' +

                  '</div>' +

                  '<div style="text-align:right">' +

                    '<b>' +
                    r.nominal +
                    '</b><br>' +

                    '<small>' +
                    r.tanggal +
                    '</small>' +

                  '</div>' +

                  '<button ' +
                    'class="btnDelete" ' +
                    'onclick="hapusRiwayat(' +
                    r.row +
                    ')" ' +
                    'title="Hapus transaksi">' +

                    '🗑' +

                  '</button>' +

                '</div>';

            }
          );


          history.innerHTML =
            html;

        }
      );

    }


    function hapusRiwayat(row) {

      var yakin =
        confirm(
          "Hapus transaksi ini?\n\n" +
          "Data yang dihapus tidak dapat dikembalikan."
        );


      if (!yakin) {
        return;
      }


      jsonp(
        "hapus",
        {
          row: row
        },
        function(error, hasil) {

          if (error) {

            tampilkanPesan("Transaksi berhsil dihapus.");

            return;

          }


          if (
            !hasil ||
            !hasil.success
          ) {

            tampilkanPesan("Transaksi berhasil dihapus.");

            return;

          }


          loadDashboard();

          loadRiwayat();

        }
      );

    }
function tampilkanPesan(pesan) {
  const popup = document.createElement("div");

  popup.textContent = pesan;

  popup.style.position = "fixed";
  popup.style.left = "50%";
  popup.style.top = "50%";
  popup.style.transform = "translate(-50%, -50%)";
  popup.style.background = "#1565C0";
  popup.style.color = "#fff";
  popup.style.padding = "14px 24px";
  popup.style.borderRadius = "12px";
  popup.style.fontSize = "16px";
  popup.style.fontWeight = "600";
  popup.style.zIndex = "99999";
  popup.style.boxShadow = "0 6px 20px rgba(0,0,0,0.25)";

  document.body.appendChild(popup);

  setTimeout(() => {
    popup.remove();
  }, 1800);
}
  </script>

</body>

</html>
